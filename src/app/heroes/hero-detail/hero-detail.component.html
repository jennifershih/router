<h2>HEROES</h2>
@if (hero$ | async; as hero) {
  <div>
    <h3>"{{ hero.name }}"</h3>
    <div><strong>Id: </strong>{{ hero.id }}</div>
    <div>
      <label for="hero-name">Name: </label>
      <input id="hero-name" [(ngModel)]="hero.name" placeholder="name" />
    </div>
    <p>
      <button (click)="gotoHeroes(hero)">Back</button>
    </p>
  </div>
}
