@if (crisis) {
  <div>
    <h3>"{{ editName }}"</h3>
    <div><strong>Id: </strong>{{ crisis.id }}</div>
    <div>
      <label for="crisis-name">Name: </label>
      <input id="crisis-name" [(ngModel)]="editName" placeholder="name" />
    </div>
    <p>
      <button (click)="save()">Save</button>
      <button (click)="cancel()">Cancel</button>
    </p>
  </div>
}
